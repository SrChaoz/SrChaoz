name: Generar métricas de perfil

on:
  schedule:
    - cron: "0 */6 * * *" # se regenera cada 6 horas
  workflow_dispatch: {}   # te permite correrlo manualmente desde la pestaña Actions
  push:
    branches:
      - main

jobs:
  metrics:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generar panel de métricas
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: SrChaoz
          filename: github-metrics.svg
          template: classic
          base: "header, activity, community, repositories, metadata"
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          config_timezone: America/Guayaquil
