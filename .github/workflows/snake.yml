name: Generar snake de contribuciones

on:
  schedule:
    - cron: "0 */6 * * *" # se regenera cada 6 horas
  workflow_dispatch: {}   # te permite correrlo manualmente desde la pestaña Actions
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generar SVG del snake
        uses: Platane/snk@v3
        with:
          github_user_name: SrChaoz
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publicar en la rama "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
